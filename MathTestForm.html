<!DOCTYPE html>
<html>
<head>
    <title>Math Quiz</title>
</head>
<body>

    <!-- Start of test -->
    <form>
        <h1>My Math Quiz</h1>

        <!-- Name Field -->
        Name: <input type="text" name="student_name"><br><br>

        <!-- Question 1 -->
        <p>1. What is 2 &plus; 2?</p>
        <input type="radio" name="q1" value="3"> 3<br>
        <input type="radio" name="q1" value="4"> 4<br><br>

        <!-- Question 2 -->
        <p>2. What is 5 &minus; 3?</p>
        <input type="radio" name="q2" value="1"> 1<br>
        <input type="radio" name="q2" value="2"> 2<br><br>

        <!-- Question 3 -->
        <p>3. What is 3 &times; 3?</p>
        <input type="radio" name="q3" value="6"> 6<br>
        <input type="radio" name="q3" value="9"> 9<br><br>

        <!-- Word Problem -->
        <p>4. Word Problem: If you have 4 cookies and eat 1, how many are left? Explain below:</p>
        <textarea name="word_problem" rows="3" cols="30"></textarea><br><br>

        <!-- Submit Button -->
        <input type="submit" value="Submit">
    </form>
    <!-- End of test -->

</body>
</html>
